# @package _global_
scratch:
  resolution: 1024
  sam_image_size: 1024
  train_batch_size: 1
  num_train_workers: 4
  num_frames: 3
  max_num_objects: 3
  base_lr: 5.0e-6
  vision_lr: 3.0e-06
  phases_per_epoch: 1
  num_epochs: 40
  samples_per_volume: 100
  samples_per_volume_val: 10
  val_epoch_freq: 1
dataset:
  config:
    mean: null
    std: null
    train: ???
    val: ???
  multiplier: 1
  single_object_mode: true
  use_ref_mask: ???
  use_few_masks: true
  mask_to_binary: true
  scale_mask_value: false
vos:
  train_transforms:
    - _target_: training.dataset.sam_transforms.Compose
      transforms:
        - _target_: training.dataset.sam_transforms.ToTensor
        - _target_: training.dataset.sam_transforms.RepeatChannels
          num_channels: 3
trainer:
  _target_: training.trainer.Trainer
  mode: train
  max_epochs: ${times:${scratch.num_epochs},${scratch.phases_per_epoch}}
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: ${scratch.val_epoch_freq}
  model:
    _target_: training.model.sam2.SAM2Train
    image_encoder:
      _target_: sam2.modeling.backbones.image_encoder.ImageEncoder
      scalp: 1
      trunk:
        _target_: sam2.modeling.backbones.hieradet.Hiera
        embed_dim: 96
        num_heads: 1
        drop_path_rate: 0.1
        stages: [1, 2, 7, 2]
        global_att_blocks: [5, 7, 9]
        window_pos_embed_bkg_spatial_size: [7, 7]
      neck:
        _target_: sam2.modeling.backbones.image_encoder.FpnNeck
        position_encoding:
          _target_: sam2.modeling.position_encoding.PositionEmbeddingSine
          num_pos_feats: 256
          normalize: true
          scale: null
          temperature: 10000
        d_model: 256
        backbone_channel_list: [768, 384, 192, 96]
        fpn_top_down_levels: [2, 3]
        fpn_interp_model: nearest
    memory_attention:
      _target_: sam2.modeling.memory_attention.MemoryAttention
      d_model: 256
      pos_enc_at_input: true
      layer:
        _target_: sam2.modeling.memory_attention.MemoryAttentionLayer
        activation: relu
        dim_feedforward: 2048
        dropout: 0.1
        pos_enc_at_attn: false
        self_attention:
          _target_: sam2.modeling.sam.transformer.RoPEAttention
          rope_theta: 10000.0
          feat_sizes: [64, 64]
          embedding_dim: 256
          num_heads: 1
          downsample_rate: 1
          dropout: 0.1
        d_model: 256
        pos_enc_at_cross_attn_keys: true
        pos_enc_at_cross_attn_queries: false
        cross_attention:
          _target_: sam2.modeling.sam.transformer.RoPEAttention
          rope_theta: 10000.0
          feat_sizes: [64, 64]
          rope_k_repeat: True
          embedding_dim: 256
          num_heads: 1
          downsample_rate: 1
          dropout: 0.1
          kv_in_dim: 64
      num_layers: 4
    memory_encoder:
        _target_: sam2.modeling.memory_encoder.MemoryEncoder
        out_dim: 64
        position_encoding:
          _target_: sam2.modeling.position_encoding.PositionEmbeddingSine
          num_pos_feats: 64
          normalize: true
          scale: null
          temperature: 10000
        mask_downsampler:
          _target_: sam2.modeling.memory_encoder.MaskDownSampler
          kernel_size: 3
          stride: 2
          padding: 1
        fuser:
          _target_: sam2.modeling.memory_encoder.Fuser
          layer:
            _target_: sam2.modeling.memory_encoder.CXBlock
            dim: 256
            kernel_size: 7
            padding: 3
            layer_scale_init_value: 1e-6
            use_dwconv: True
          num_layers: 2
    num_maskmem: 7
    use_sdf: true
    use_ref_mask: ${dataset.use_ref_mask}
    use_current_frame_memory: true
    track_in_both_directions: true
    image_size: ${scratch.sam_image_size}
    sigmoid_scale_for_mem_enc: 20.0
    sigmoid_bias_for_mem_enc: -10.0
    use_mask_input_as_output_without_sam: true
    directly_add_no_mem_embed: true
    no_obj_embed_spatial: true
    use_high_res_features_in_sam: true
    multimask_output_in_sam: true
    iou_prediction_use_sigmoid: True
    use_obj_ptrs_in_encoder: true
    add_tpos_enc_to_obj_ptrs: true
    proj_tpos_enc_in_obj_ptrs: true
    use_signed_tpos_enc_to_obj_ptrs: true
    only_obj_ptrs_in_the_past_for_eval: true
    pred_obj_scores: true
    pred_obj_scores_mlp: true
    fixed_no_obj_ptr: true
    multimask_output_for_tracking: true
    use_multimask_token_for_obj_ptr: true
    multimask_min_pt_num: 0
    multimask_max_pt_num: 1
    use_mlp_for_obj_ptr_proj: true
    prob_to_use_pt_input_for_train: 0.0
    prob_to_use_pt_input_for_eval: 0.0
    prob_to_use_box_input_for_train: 0.0
    prob_to_use_box_input_for_eval: 0.0
    prob_to_sample_from_gt_for_train: 0.1
    num_frames_to_correct_for_train: 2
    num_frames_to_correct_for_eval: 1
    rand_frames_to_correct_for_train: True
    add_all_frames_to_correct_as_cond: True
    num_init_cond_frames_for_train: 1
    rand_init_cond_frames_for_train: True
    num_correction_pt_per_frame: 7
    use_act_ckpt_iterative_pt_sampling: false
    num_init_cond_frames_for_eval: 1
    forward_backbone_per_frame_for_eval: True
    freeze_config:
      freeze_image_encoder: True
      freeze_memory_attention: False
      freeze_memory_encoder: False
  data:
    train:
      _target_: training.dataset.sam2_datasets.TorchTrainMixedDataset
      phases_per_epoch: ${scratch.phases_per_epoch}
      batch_sizes:
        - ${scratch.train_batch_size}
      datasets:
        - _target_: training.dataset.sam.SAMVolumeDataset
          transforms: ${vos.train_transforms}
          training: true
          video_dataset:
            _target_: training.dataset.volumes.VolumeDataset
            dataset_config: ${dataset.config.train}
            volume_io:
              _target_: utils.misc.VolumeIO
            single_object_mode: ${dataset.single_object_mode}
            resolution: ${scratch.resolution}
            use_ref_mask: ${dataset.use_ref_mask}
            restore_ref_to_image_grid: true
            use_few_masks: ${dataset.use_few_masks}
            mask_to_binary: ${dataset.mask_to_binary}
            scale_mask_value: ${dataset.scale_mask_value}
            split: train
          multiplier: ${dataset.multiplier}
          sampler:
            _target_: training.dataset.samplers.AnnotatedSliceSampler
            num_frames: ${scratch.num_frames}
            max_num_objects: ${scratch.max_num_objects}
            gt_prob: 0.8
          samples_per_volume: ${scratch.samples_per_volume}
      shuffle: True
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      persistent_workers: True
      drop_last: True
      collate_fn:
        _target_: training.utils.data_utils.collate_fn
        _partial_: true
        dict_key: all
    val:
      _target_: training.dataset.sam2_datasets.TorchTrainMixedDataset
      phases_per_epoch: 1
      batch_sizes:
        - ${scratch.train_batch_size}
      datasets:
        - _target_: training.dataset.sam.SAMVolumeDataset
          transforms: ${vos.train_transforms}
          training: false
          video_dataset:
            _target_: training.dataset.volumes.VolumeDataset
            dataset_config: ${dataset.config.val}
            volume_io:
              _target_: utils.misc.VolumeIO
            single_object_mode: ${dataset.single_object_mode}
            resolution: ${scratch.resolution}
            use_ref_mask: ${dataset.use_ref_mask}
            restore_ref_to_image_grid: true
            use_few_masks: ${dataset.use_few_masks}
            mask_to_binary: ${dataset.mask_to_binary}
            scale_mask_value: ${dataset.scale_mask_value}
            split: val
          multiplier: ${dataset.multiplier}
          sampler:
            _target_: training.dataset.samplers.AnnotatedSliceSampler
            num_frames: ${scratch.num_frames}
            max_num_objects: ${scratch.max_num_objects}
            gt_prob: 0.8
          samples_per_volume: ${scratch.samples_per_volume_val}
      shuffle: False
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      persistent_workers: True
      drop_last: False
      collate_fn:
        _target_: training.utils.data_utils.collate_fn
        _partial_: true
        dict_key: val
  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16
    optimizer:
      _target_: torch.optim.AdamW
    gradient_clip:
      _target_: training.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2
    param_group_modifiers:
      - _target_: training.optimizer.layer_decay_param_modifier
        _partial_: True
        layer_decay_value: 0.9
        apply_to: 'image_encoder.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0
    options:
      lr:
        - scheduler:
            _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: ${scratch.base_lr}
            end_value: ${divide:${scratch.base_lr},10}
        - scheduler:
            _target_: fvcore.common.param_scheduler.CosineParamScheduler
            start_value: ${scratch.vision_lr}
            end_value: ${divide:${scratch.vision_lr},10}
          param_names:
            - 'image_encoder.*'
      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.1
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']
  loss:
    all:
      _target_: training.loss_sam.MultiStepMultiMasksAndIous
      weight_dict:
        loss_mse: 0
        loss_mask: 20
        loss_dice: 1
        loss_iou: 1
        loss_class: 1
      supervise_all_iou: true
      iou_use_l1_loss: true
      pred_obj_scores: true
      focal_gamma_obj_score: 0.0
      focal_alpha_obj_score: -1.0
    val:
      _target_: training.loss_sam.MultiStepMultiMasksAndIous
      weight_dict:
        loss_mse: 0
        loss_mask: 20
        loss_dice: 1
        loss_iou: 1
        loss_class: 1
      supervise_all_iou: true
      iou_use_l1_loss: true
      pred_obj_scores: true
      focal_gamma_obj_score: 0.0
      focal_alpha_obj_score: -1.0
  distributed:
    backend: gloo
    find_unused_parameters: True
  logging:
    log_level_primary: INFO
    tensorboard_writer:
      _target_: training.utils.logger.make_tensorboard_logger
      log_dir:  ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: True
    log_dir: ${launcher.experiment_log_dir}/logs
    log_freq: 10
  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 0
    model_weight_initializer:
      _partial_: True
      _target_: training.utils.checkpoint_utils.load_state_dict_into_model
      strict: False
      ignore_unexpected_keys: null
      ignore_missing_keys: null
      state_dict:
        _target_: training.utils.checkpoint_utils.load_checkpoint_and_apply_kernels
        checkpoint_path: ${launcher.ckpt_path}
        ckpt_state_dict_keys: ['model']
launcher:
  num_nodes: 1
  gpus_per_node: 1
  ckpt_path: null
  experiment_log_dir: ???
