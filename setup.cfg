[metadata]
name = spatial-sam
version = 0.0.1
description = SpatialSAM for 3D electron microscopy segmentation
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files =
    LICENSE
    licenses/*.txt

[options]
packages = find_namespace:
include_package_data = True
python_requires = >=3.10
install_requires =
    torch
    torchvision
    numpy
    scipy
    scikit-image
    hydra-core
    omegaconf
    iopath
    fvcore
    tensordict
    tensorboard
    tqdm
    Pillow
    opencv-python
    tifffile
    zstandard

[options.packages.find]
include =
    config
    config.*
    dataprocess
    dataprocess.*
    predict
    predict.*
    sam2
    sam2.*
    spatialsam
    spatialsam.*
    training
    training.*
    utils
    utils.*
exclude =
    *__pycache__*

[options.package_data]
* = *.yaml
sam2 = csrc/*.cu

[options.entry_points]
console_scripts =
    spatialsam = spatialsam.cli:main
